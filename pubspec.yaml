name: my_friend_app
description: "Sahyatri (सहयात्री) — local worker marketplace app."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^12.3.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_storage: ^12.3.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.4.0
  cloud_functions: ^5.1.3
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.13.1
  google_mlkit_text_recognition: ^0.15.0
  record: ^7.1.1
  audioplayers: ^6.1.0
  http: ^1.2.0
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0
  google_maps_flutter_android: ^2.19.0
  google_maps_flutter_platform_interface: ^2.16.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  flutter_webrtc: ^1.6.2+hotfix.3
  permission_handler: ^11.3.1
  local_auth: ^2.3.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  safe_device: ^1.1.6
  cached_network_image: ^3.4.1
  path_provider: ^2.1.4
  country_picker: ^2.0.28

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.9
  package_info_plus: ^10.2.1
  open_filex: ^4.7.0
  video_player: ^2.9.5
  flutter_image_compress: ^2.3.0
  mobile_scanner: ^7.4.2
  flutter_displaymode: ^0.7.0
  sensors_plus: ^7.1.1
  firebase_app_check: ^0.3.2+10
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.2

# Sahayatri launcher icon — `dart run flutter_launcher_icons` (re)generates
# every platform's icon set from assets/icon/app_icon*.png.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#07060D"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

# यहाँ मात्र `google_maps_flutter_web`/`flutter_webrtc` लाई साना, स्थानीय
# patch सहितको आफ्नै copy बाट लिने — किन र के फरक छ भन्ने सम्बन्धित
# `third_party/<package>/PATCH.md` मा। Package upgrade हुँदा त्यही file
# हेर्नुहोस्।
dependency_overrides:
  google_maps_flutter_web:
    path: third_party/google_maps_flutter_web
  flutter_webrtc:
    path: third_party/flutter_webrtc

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/services/
    - assets/images/markers/
    - assets/icon/

  # Bundled locally (rather than fetched at runtime via google_fonts) so the
  # home-banner typography doesn't depend on the device's network/cache —
  # a corrupted runtime download of Cinzel was mangling the S/s glyphs.
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel.ttf