name: my_friend_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^12.3.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_storage: ^12.3.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.4.0
  cloud_functions: ^5.1.3
  image_picker: ^1.1.2
  record: ^7.1.1
  audioplayers: ^6.1.0
  http: ^1.2.0
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  flutter_webrtc: ^1.6.2+hotfix.1
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  cached_network_image: ^3.4.1

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^3.0.0

# यहाँ मात्र `google_maps_flutter_web` लाई साना, स्थानीय patch सहितको आफ्नै
# copy बाट लिने — किन र के फरक छ भन्ने `third_party/google_maps_flutter_web/
# PATCH.md` मा। Package upgrade हुँदा त्यही file हेर्नुहोस्।
dependency_overrides:
  google_maps_flutter_web:
    path: third_party/google_maps_flutter_web

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/services/