org.gradle.jvmargs=-Xmx4G
# Build machine आज राति गम्भीर memory दबावमा छ — Gradle daemon default रूपमा
# build सकिएपछि पनि (कहिल्यै बन्द नभई, background मा ~2GB सम्म) बसिरहन्थ्यो,
# अनि Chrome/flutter-tools सँगै लडेर OOM kill दोहोर्‍याउने मुख्य कारण बन्थ्यो।
# daemon बन्द गर्दा हरेक build अलि ढिलो हुन्छ (warm-start reuse छैन), तर
# build सकिनेबित्तिकै JVM पूर्ण रूपमा बाहिरिन्छ — memory कहिल्यै जम्मा हुँदैन।
org.gradle.daemon=false
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
