<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <!--
    Web OAuth client ID for Google Sign-In. This MUST belong to the same
    Google Cloud / Firebase project as lib/firebase_options.dart
    (project number 504837034251, project id kaammitra-87e38).
    The plugin reads the meta name "google-signin-client_id" (underscore).
  -->
  <meta name="google-signin-client_id" content="504837034251-h3ol9ehaksf1biicqgig2o5hn6fv14u2.apps.googleusercontent.com">
  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="my_friend_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>my_friend_app</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>

  <!--
    Google Maps JavaScript API — Saved Places को location picker (नक्सा) को लागि।
    तल YOUR_GOOGLE_MAPS_API_KEY लाई तपाईंको असली key ले बदल्नुहोस्:
      https://console.cloud.google.com/google/maps-apis
      → "Maps JavaScript API" enable → Credentials → API key
    Key नराखेसम्म नक्सा grey box देखिन्छ; picker मा "मेरो स्थान प्रयोग गर्नुहोस्" भने चल्छ।
  -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDkbnRYfqKo8khNvgrFj26z2WX2Ao9xsiU"></script>

  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
